name: Build iOS IPA (TrollStore)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios-ipa.yml'
      - 'public/logo.svg'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate version
        id: version
        run: |
          MAJOR=1
          MINOR=0
          PATCH=$(printf "%02d" $((${{ github.run_number }} / 100)))
          BUILD=$(printf "%02d" $((${{ github.run_number }} % 100)))
          echo "version=${MAJOR}.${MINOR}.${PATCH}.${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}.${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update package.json version
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${{ steps.version.outputs.version }}';
            require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build web
        run: npm run build

      - name: Add iOS platform
        run: test -d ios || npx cap add ios

      - name: Sync iOS platform
        run: |
          npx cap sync ios
          echo "--- capacitor.config.json ---"
          cat ios/App/App/capacitor.config.json

      - name: Patch Info.plist (allow http / LAN servers)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy

          $PB -c "Delete :NSAppTransportSecurity" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :NSAppTransportSecurity dict" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          $PB -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"

          # 解锁 ProMotion 高刷
          $PB -c "Delete :CADisableMinimumFrameDurationOnPhone" "$PLIST" >/dev/null 2>&1 || true
          $PB -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"

          # 版本号注入：否则 TrollStore 里永远显示模板写死的 1.0
          VERSION="${{ steps.version.outputs.version }}"
          $PB -c "Set :CFBundleShortVersionString $VERSION" "$PLIST" 2>/dev/null \
            || $PB -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          $PB -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" 2>/dev/null \
            || $PB -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"

          $PB -c "Print :CFBundleShortVersionString" "$PLIST"
          $PB -c "Print :CFBundleVersion" "$PLIST"
          $PB -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: Generate iOS App Icons
        run: |
          npm install --no-save sharp
          node -e "
            const fs = require('fs');
            const sharp = require('sharp');
            const svg = fs.readFileSync('public/logo.svg', 'utf8');
            sharp(Buffer.from(svg)).resize(1024,1024).png().toFile('/tmp/icon.png');
          "
          DST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$DST"
          for s in 20 29 40 58 60 76 80 87 120 152 167 180 1024; do
            sips -z $s $s /tmp/icon.png --out "$DST/icon-${s}.png"
          done
          cat > "$DST/Contents.json" << 'EOF'
          {
            "images": [
              { "size": "20x20", "idiom": "iphone", "filename": "icon-40.png", "scale": "2x" },
              { "size": "20x20", "idiom": "iphone", "filename": "icon-60.png", "scale": "3x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-58.png", "scale": "2x" },
              { "size": "29x29", "idiom": "iphone", "filename": "icon-87.png", "scale": "3x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-80.png", "scale": "2x" },
              { "size": "40x40", "idiom": "iphone", "filename": "icon-120.png", "scale": "3x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-120.png", "scale": "2x" },
              { "size": "60x60", "idiom": "iphone", "filename": "icon-180.png", "scale": "3x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-20.png", "scale": "1x" },
              { "size": "20x20", "idiom": "ipad", "filename": "icon-40.png", "scale": "2x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-29.png", "scale": "1x" },
              { "size": "29x29", "idiom": "ipad", "filename": "icon-58.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-80.png", "scale": "2x" },
              { "size": "40x40", "idiom": "ipad", "filename": "icon-120.png", "scale": "3x" },
              { "size": "60x60", "idiom": "ipad", "filename": "icon-76.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-76.png", "scale": "1x" },
              { "size": "76x76", "idiom": "ipad", "filename": "icon-152.png", "scale": "2x" },
              { "size": "83.5x83.5", "idiom": "ipad", "filename": "icon-167.png", "scale": "2x" },
              { "size": "1024x1024", "idiom": "ios-marketing", "filename": "icon-1024.png", "scale": "1x" }
            ],
            "info": { "version": 1, "author": "xcode" }
          }
          EOF

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "App.xcarchive/Products/Applications/App.app" Payload/
          codesign -s - --force --deep "Payload/App.app"
          zip -r trilium-mobile.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: trilium-mobile-ipa
          path: trilium-mobile.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "${TAG}" \
            --title "Trilium Mobile v${VERSION}" \
            --notes "Trilium 手机伴侣端 v${VERSION} 自动构建" \
            --target "${{ github.sha }}" \
            trilium-mobile.ipa

      - name: Cleanup old releases (keep latest 20)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          KEEP=20
          COUNT=0
          echo "$RELEASES" | while read -r TAG; do
            [ -z "$TAG" ] && continue
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting old release $TAG"
              gh release delete "$TAG" --yes || true
            fi
          done
